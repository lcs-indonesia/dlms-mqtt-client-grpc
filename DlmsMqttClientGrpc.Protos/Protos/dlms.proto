syntax = "proto3";

import "google/protobuf/struct.proto";

option csharp_namespace = "DlmsMqttClientGrpc";

package dlms;

service DlmsProto{
	rpc ConnectAndRead(ConnectAndReadRequest) returns (ConnectAndReadReply);
}

message ConnectAndReadRequest{
	string sessionId = 1;
	repeated string args = 2;
}

message ConnectAndReadReply{
	google.protobuf.Struct value = 1;
}