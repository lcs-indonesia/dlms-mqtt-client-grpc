name: Build and Push Docker Image

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install registry CA certificate
        run: |
          echo "${{ secrets.REGISTRY_CA_CERT_BASE64 }}" | base64 -d | sudo tee /usr/local/share/ca-certificates/registry.crt > /dev/null
          sudo update-ca-certificates

      - name: Allow insecure registry
        run: |
          echo '{"insecure-registries":["${{ secrets.REGISTRY }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Verify CA cert installed
        run: ls -l /usr/local/share/ca-certificates

      - name: Login to self-hosted registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest \
          -t ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAME }}:${{ github.ref_name }} \
          .

      - name: Push Docker image
        run: |
          docker push --all-tags ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAME }}
